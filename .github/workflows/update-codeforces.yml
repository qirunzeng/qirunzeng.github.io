name: Update Codeforces Stats
on:
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-site-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify aggregation
        run: python -m unittest discover -s tests -p 'test_codeforces.py' -v
      - name: Fetch official snapshot
        run: python scripts/update_codeforces.py
      - name: Commit verified snapshot
        id: commit
        run: bash scripts/commit_snapshot.sh "Update Codeforces statistics" _data/codeforces.json
      - name: Request Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
