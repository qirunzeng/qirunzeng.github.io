name: Update Programming Stats
on:
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "Account to refresh"
        type: choice
        default: all
        options: [all, codeforces, atcoder, leetcode, luogu]
permissions:
  contents: write
  pages: write
concurrency:
  group: update-site-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify aggregation
        run: |
          python -m unittest discover -s tests -p 'test_codeforces.py' -v
          python -m unittest discover -s tests -p 'test_programming.py' -v
      - name: Fetch official snapshot
        if: github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'codeforces'
        continue-on-error: true
        run: python scripts/update_codeforces.py
      - name: Refresh programming accounts and combined charts
        env:
          PROVIDER: ${{ inputs.provider || 'all' }}
        run: |
          if [ "$PROVIDER" = "all" ]; then
            python scripts/update_programming.py
          else
            python scripts/update_programming.py --only "$PROVIDER"
          fi
      - name: Commit verified snapshot
        id: commit
        run: bash scripts/commit_snapshot.sh "Update programming statistics" _data/codeforces.json _data/programming.json
      - name: Request Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
