name: Scholar Cloud Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Probe and validate real Scholar data
        shell: bash
        run: |
          python -u - <<'PY'
          import json, pathlib, sys
          from urllib.parse import quote
          from scripts import update_scholar as s
          config=s.read_config(s.DEFAULT_DATA_PATH)
          existing,_=s.read_existing(s.DEFAULT_DATA_PATH)
          publications=s.read_publication_data(s.DEFAULT_PUBLICATION_DATA_PATH,config)
          def validate(snapshot):
              s.validate_snapshot(snapshot,config,existing)
              s.reconcile_publication_citations(snapshot,publications,checked_at='diagnostic')
              print('VALIDATED',snapshot.provider,snapshot.metrics,'papers',len(snapshot.publications),flush=True)
          try:
              raw=s.fetch_bytes(config.source_url+'&pagesize=100',timeout=15)
              validate(s.parse_scholar_html(raw.decode('utf-8',errors='replace')))
              sys.exit(0)
          except Exception as exc:
              print('DIRECT FAILED:',type(exc).__name__,str(exc),flush=True)
          try:
              user=quote(s.scholar_user_id(config.source_url)+'&pagesize=100',safe='')
              raw=s.fetch_bytes(s.BTH_MIRROR_URL+'?user='+user,timeout=10)
              validate(s.parse_bth_payload(json.loads(raw),expected_name=config.expected_name,identity_publication=config.identity_publication))
          except Exception as exc:
              print('MIRROR FAILED:',type(exc).__name__,str(exc),flush=True)
              sys.exit(1)
          PY
