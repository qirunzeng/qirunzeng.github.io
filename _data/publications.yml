preprints:
  - id: "best-arm-hybrid-feedback"
    title: "Best Arm Identification in Generalized Linear Bandits via Hybrid Feedback"
    publication_date: "7 May 2026"
    publication_date_iso: "2026-05-07"
    doi: "10.48550/arXiv.2605.05745"
    abstract: >-
      This paper considers fixed-confidence best-arm identification in generalized linear bandits when the learner may request either a single-arm reward or a pairwise comparison. A likelihood-ratio confidence sequence combines the two observation types into an ellipsoidal confidence set. Building on it, a hybrid Track-and-Stop algorithm adapts its queries through a minimax design over arms and pairs. The analysis gives correctness and stopping-time guarantees, extends to unequal acquisition costs, and is supported by experiments showing improved sample efficiency.
    authors:
      - name: "Qirun Zeng"
