  - id: "adversarial-bandits-fake-data"
    title: "Practical Adversarial Attacks on Stochastic Bandits via Fake Data Injection"
    publication_date: "28 May 2025"
    publication_date_iso: "2025-05-28"
    doi: "10.48550/arXiv.2505.21938"
    abstract: >-
      This work replaces common, highly permissive bandit-attack assumptions with a bounded fake-data-injection model: an attacker may add only a limited number of plausible feedback samples to the learner's history. It develops attacks that respect both value and timing constraints, and shows that they can make a target arm dominate the learner's choices while keeping total attack cost sublinear. Tests on synthetic and real data demonstrate the practical vulnerability of stochastic bandit algorithms under this threat model.
    authors:
      - name: "Qirun Zeng"
        me: true
      - name: "Eric He"
