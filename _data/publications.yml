  - id: "one-rounding-fits-all"
    title: "One Rounding Fits All: Memory-Efficient Approximation Algorithms for Partition-Constrained Influence Maximization"
    publication_date: "8 August 2026"
    publication_date_iso: "2026-08-08"
    doi: "10.1145/3770855.3817696"
    abstract: >-
      Partition-constrained influence maximization generalizes viral-marketing problems from one seed set to multiple groups, but existing approximation methods can require substantial memory and extra samples for validation. This work introduces RBwA, a progressive-sampling algorithm that uses Rademacher averages to estimate solution quality, removes the separate validation set, and reduces rounding to one call. Its BwARound subroutine stores a single fractional vector and takes maximal feasible steps. Experiments on large social networks show gains in memory use, sample efficiency, and iteration count.
