  - id: "fusing-reward-dueling"
    title: "Fusing Reward and Dueling Feedback in Stochastic Bandits"
    publication_date: "13 July 2025"
    publication_date_iso: "2025-07-13"
    doi: "10.48550/arXiv.2504.15812"
    abstract: >-
      This work studies stochastic bandits that provide both absolute reward observations and relative pairwise comparisons. It establishes a regret lower bound and develops two ways to combine the feedback: an elimination method that shares candidate sets, and a decomposition method that assigns the more informative feedback to exploration while using the other for exploitation. Under a standard assumption, the decomposition approach matches the lower bound up to constants. Experiments support the theoretical benefit of choosing between feedback types arm by arm.
