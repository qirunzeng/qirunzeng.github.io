<article class="teaching-item">
  <p class="teaching-item__term">{{ include.item.term }}</p>
  <span class="teaching-item__marker" aria-hidden="true"></span>
  <div class="teaching-item__body">
    <h2>{{ include.item.course }}</h2>
    <p>{{ include.item.institution }}</p>
    <p class="teaching-item__unit">{{ include.item.unit }}</p>
    {% if include.item.links %}
      <p class="teaching-item__links">
        {% for link in include.item.links %}
          <a class="tag tag--{{ link.type }}" href="{{ link.url | relative_url }}"{% if link.url contains '://' %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.label }}</a>
        {% endfor %}
      </p>
    {% endif %}
  </div>
</article>
