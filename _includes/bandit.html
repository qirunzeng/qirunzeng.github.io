<div class="bandit" data-bandit tabindex="0" aria-label="Interactive two-armed bandit game">
  <div class="bandit__topbar">
    <div class="bandit__intro">
      <div>
        <p>Choose an arm each round. Discover which one rewards you more often.</p>
      </div>
    </div>

    <form class="bandit__setup" data-bandit-setup>
      <label for="bandit-rounds">Rounds</label>
      <input id="bandit-rounds" data-bandit-rounds type="number" value="10" min="1" max="100" step="1" inputmode="numeric">
      <button type="submit">New game</button>
    </form>
  </div>

  <div class="bandit__scoreboard" aria-label="Game statistics">
    <div>
      <span>Round</span>
      <strong data-bandit-round>0 / 10</strong>
    </div>
    <div>
      <span>Reward</span>
      <strong data-bandit-reward>0</strong>
    </div>
    <div>
      <span>Expected regret</span>
      <strong data-bandit-regret>hidden</strong>
    </div>
  </div>

  <div class="bandit__progress" aria-hidden="true"><span data-bandit-progress></span></div>

  <div class="bandit__arms">
    <button class="bandit-arm" type="button" data-bandit-arm="a" aria-label="Pull arm A">
      <span class="bandit-arm__letter">A</span>
      <span class="bandit-arm__stats"><span data-bandit-pulls="a">0 pulls</span><span data-bandit-wins="a">0 rewards</span></span>
      <span class="bandit-arm__chance" data-bandit-chance="a">probability hidden</span>
    </button>

    <span class="bandit__versus" aria-hidden="true">or</span>

    <button class="bandit-arm" type="button" data-bandit-arm="b" aria-label="Pull arm B">
      <span class="bandit-arm__letter">B</span>
      <span class="bandit-arm__stats"><span data-bandit-pulls="b">0 pulls</span><span data-bandit-wins="b">0 rewards</span></span>
      <span class="bandit-arm__chance" data-bandit-chance="b">probability hidden</span>
    </button>
  </div>

  <div class="bandit__feedback" data-bandit-feedback aria-live="polite">Choose an arm to begin.</div>

  <div class="bandit__history-wrap">
    <span>Reward trail</span>
    <ol class="bandit__history" data-bandit-history aria-label="Reward history"></ol>
  </div>

</div>
